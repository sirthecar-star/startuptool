<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>차별화 도우미</title>
<style>
  :root{ --bg:#eef3f8; --card:#fff; --ink:#16202e; --sub:#586579; --line:#d6dde9; --accent:#2563eb; --soft:#e8f0ff; --good:#15803d; --warn:#b45309; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",sans-serif;line-height:1.6}
  header{background:#0f2a4a;color:#fff;padding:10px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
  header h1{margin:0;font-size:17px}
  header .sp{flex:1}
  header .st{font-size:12.5px;color:#b7c9e6}
  header button,header label.btn{font:inherit;font-size:12.5px;padding:5px 10px;border-radius:8px;border:1px solid #2d4f7c;background:#173a64;color:#fff;cursor:pointer;font-weight:600}
  .steps{display:flex;gap:8px;max-width:980px;margin:14px auto 0;padding:0 16px}
  .steps button{flex:1;font:inherit;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:9px 14px;cursor:pointer}
  .steps button b{display:block;font-size:14px}
  .steps button small{color:var(--sub);font-size:12px}
  .steps button.on{border-color:var(--accent);background:var(--soft)}
  .steps button.done b::after{content:" ✓";color:var(--good)}
  .wrap{max-width:980px;margin:0 auto;padding:12px 16px 90px}
  .prog{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--sub);margin:10px 0}
  .prog .bar{flex:1;height:8px;background:#dbe5f2;border-radius:99px;overflow:hidden}
  .prog .bar i{display:block;height:100%;background:linear-gradient(90deg,#2563eb,#7c3aed);width:0;transition:width .3s}
  .intro{background:#fff7ed;border:1px solid #fed7aa;border-radius:14px;padding:10px 14px;font-size:13.5px;color:#9a3412;margin-bottom:12px}
  .intro button{font:inherit;font-size:12.5px;font-weight:700;margin-left:6px;padding:3px 10px;border-radius:8px;border:1px solid #fdba74;background:#fff;cursor:pointer;color:#9a3412}
  .card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin-bottom:14px;box-shadow:0 3px 12px #2563eb10}
  .card h2{margin:0 0 4px;font-size:18px;display:flex;align-items:center;gap:10px}
  .card h2 .n{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:15px;flex:none}
  .card.done h2 .n{background:var(--good)}
  .tip{font-size:13px;color:var(--sub);margin:0 0 12px 40px}
  .q{margin-bottom:11px}
  .q>label{display:block;font-size:13.5px;font-weight:800;margin-bottom:4px}
  .q>label small{font-weight:500;color:var(--sub)}
  input[type=text],input[type=number],textarea{font:inherit;width:100%;border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;background:#f8fafc;color:var(--ink);font-size:14.5px}
  textarea{min-height:84px;resize:vertical}
  input:focus,textarea:focus{outline:2px solid #2563eb55;border-color:var(--accent)}
  .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
  .chips span{font-size:11.5px;font-weight:800;color:#7c3aed;align-self:center}
  .chips button{font:inherit;font-size:12px;border:1px dashed #a78bfa;background:#f5f3ff;color:#5b21b6;padding:2px 10px;border-radius:99px;cursor:pointer}
  .chips button:hover{background:#ede9fe}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .row4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .fn{border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:#fbfcff;margin-bottom:8px}
  .fn b{font-size:12.5px;color:var(--accent)}
  .tags{display:flex;flex-wrap:wrap;gap:6px}
  .tags label{font-size:13px;border:1.5px solid var(--line);border-radius:99px;padding:3px 12px;cursor:pointer;background:#fff;user-select:none}
  .tags input{display:none}
  .tags label.on{background:var(--soft);border-color:var(--accent);color:var(--accent);font-weight:800}
  .out{background:linear-gradient(135deg,#eff6ff,#f5f3ff);border:1px solid #c7d2fe;border-radius:14px;padding:10px 12px;margin-top:6px}
  .out .oh{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:800;color:#4338ca;margin-bottom:4px}
  .out .oh span{margin-left:auto;font-weight:600;color:var(--sub)}
  .out .oh button{font:inherit;font-size:12px;padding:2px 10px;border-radius:8px;border:1px solid #a5b4fc;background:#fff;cursor:pointer;font-weight:700;color:#4338ca}
  .out textarea{background:#fff;min-height:96px}
  .out .oh .hb2{background:linear-gradient(90deg,#2563eb,#7c3aed);color:#fff;border:0}
  .helper{margin-top:8px;background:#fff;border:1.5px solid #c7d2fe;border-radius:14px;padding:10px 12px}
  .helper .hh{font-weight:800;font-size:13.5px;color:#4338ca;margin-bottom:6px}
  .helper .hc{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
  .helper .hc span{background:#eef2ff;border-radius:99px;padding:2px 11px;font-size:12px}
  .helper .hc b{color:#4338ca;margin-right:4px}
  .helper .hb{font-size:12.5px;color:#92400e;background:#fffbeb;border-radius:8px;padding:5px 10px;margin-bottom:6px}
  .helper .hd{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:3px}
  .helper .hd button,.helper .vr button{font:inherit;font-size:12px;font-weight:700;padding:3px 12px;border-radius:8px;border:1px solid #a5b4fc;background:#eef2ff;color:#4338ca;cursor:pointer;margin-left:auto}
  .helper .hd .ok{margin-left:auto;font-size:12px;color:var(--good);font-weight:700}
  .helper pre{margin:0;white-space:pre-wrap;word-break:break-word;font:inherit;font-size:13.5px;background:#f8fafc;border-radius:10px;padding:8px 10px}
  .helper .vr{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .helper .vr button{margin-left:0}
  .helper .vt{font-size:12px;color:var(--sub);margin-top:4px}
  .helper .hk{font-size:12.5px;background:#fff7ed;border-radius:10px;padding:6px 10px;margin-top:8px;color:#9a3412}
  .helper .hk.good{background:#f0fdf4;color:#166534}
  .hintline{font-size:12.5px;margin-top:4px;color:var(--warn)}
  .hintline.ok{color:var(--good)}
  .calc{background:#f0fdfa;border:1px solid #99f6e4;border-radius:12px;padding:10px 12px;margin:6px 0 10px}
  .calc .big{font-size:18px;font-weight:900;color:#0f766e}
  .doc{background:#fff;border:1px solid #cbd5e1;box-shadow:0 4px 16px #0002;padding:22px 26px;margin:8px 0 16px;font-size:13px}
  .doc h3{text-align:center;font-size:20px;margin:0 0 10px;letter-spacing:.2em}
  .doc table{border-collapse:collapse;width:100%}
  .doc td,.doc th{border:1px solid #444;padding:6px 8px;vertical-align:top;text-align:left}
  .doc th{background:#e9ecef;font-size:13px}
  .doc td.a{min-height:70px;white-space:pre-wrap;word-break:break-word;font-size:12.5px}
  .doc td.empty{color:#aaa}
  .final{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
  .final button{font:inherit;font-weight:800;padding:12px 22px;border-radius:12px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:15px}
  .final .go{background:linear-gradient(90deg,#2563eb,#7c3aed);color:#fff;border:0;font-size:16px;box-shadow:0 6px 18px #4f46e544}
  .chk{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:6px;margin:8px 0}
  .chk div{font-size:13px;padding:5px 10px;border-radius:10px;background:#f1f5f9}
  .chk div.ok{background:#dcfce7;color:#166534} .chk div.no{background:#fee2e2;color:#991b1b}
  nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 16px;display:flex;justify-content:center;gap:10px;z-index:5}
  nav .in{max-width:980px;width:100%;display:flex;gap:10px;align-items:center}
  nav button{font:inherit;font-weight:800;padding:10px 26px;border-radius:12px;border:1px solid var(--line);background:#fff;cursor:pointer}
  nav button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  nav button:disabled{opacity:.35;cursor:default}
  nav .mid{flex:1;text-align:center;font-size:13px;color:var(--sub)}
  .qlist{display:flex;flex-direction:column;gap:5px}
  .qlist label{display:block;font-size:13.5px;border:1.5px solid var(--line);border-radius:12px;padding:6px 12px;cursor:pointer;background:#fff;user-select:none}
  .qlist input{margin-right:8px}
  .qlist label.on{background:var(--soft);border-color:var(--accent);color:#1e3a8a;font-weight:700}
  .logstat{background:#f0fdfa;border:1px solid #99f6e4;border-radius:12px;padding:8px 12px;margin-bottom:8px;font-size:13.5px}
  table.lg{border-collapse:collapse;width:100%;font-size:13px}
  table.lg th{background:#e9ecef;border:1px solid #cbd5e1;padding:5px 6px;font-size:12.5px;text-align:left}
  table.lg td{border:1px solid #cbd5e1;padding:3px}
  table.lg td:first-child{text-align:center;width:30px;color:var(--sub)}
  table.lg input,table.lg select{width:100%;font:inherit;font-size:13px;padding:5px 6px;border:1px solid #e2e8f0;border-radius:6px;background:#fff}  .avbox{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:12px}
  .avbox canvas{width:150px;height:150px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 10px #0003;flex:none}
  .avopt{flex:1;min-width:260px;display:flex;flex-direction:column;gap:6px;font-size:13px}
  .avopt b{display:inline-block;width:68px;color:var(--sub)}
  .sw{width:26px;height:26px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #94a3b8;cursor:pointer;margin-right:4px;vertical-align:middle}
  .sw.on{box-shadow:0 0 0 3px var(--accent)}
  .ob{font:inherit;font-size:12.5px;border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:2px 11px;cursor:pointer;margin-right:4px}
  .ob.on{background:var(--soft);border-color:var(--accent);color:var(--accent);font-weight:800}
  .mini{font:inherit;font-size:12.5px;font-weight:700;border:1px solid #a5b4fc;background:#fff;color:#4338ca;border-radius:8px;padding:3px 11px;cursor:pointer}  .cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:10px}
  .cs{font:inherit;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:8px 10px;cursor:pointer;display:flex;flex-direction:column;gap:1px;position:relative}
  .cs .ci{font-size:20px}.cs b{font-size:13.5px}.cs small{color:var(--sub);font-size:11.5px;line-height:1.3}
  .cs:hover{border-color:#94a3b8}
  .cs.on{background:var(--soft);border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
  .cs.on::after{content:"✓";position:absolute;right:8px;top:6px;color:var(--accent);font-weight:900}
  .selrows{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
  .selrow{display:grid;grid-template-columns:150px 1fr 34px;gap:8px;align-items:center;background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:5px 8px}
  .selrow b{font-size:13px}.selrow input{padding:6px 9px;font-size:13.5px}
  .selrow .x{font:inherit;border:0;background:#fee2e2;color:#991b1b;border-radius:8px;cursor:pointer;padding:3px 0}
  .cadd{display:flex;gap:8px;margin-bottom:6px}.cadd input{flex:1;padding:7px 10px;font-size:13.5px}
  .mini{font:inherit;font-size:12.5px;font-weight:700;border:1px solid #a5b4fc;background:#fff;color:#4338ca;border-radius:8px;padding:3px 11px;cursor:pointer}
  details.minicv{background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px 12px;margin-bottom:14px}
  details.minicv summary{cursor:pointer;font-weight:800;font-size:14px;margin-bottom:6px}
  table.lg{border-collapse:collapse;width:100%;font-size:13px}
  table.lg th{background:#e9ecef;border:1px solid #cbd5e1;padding:5px 6px;font-size:12.5px;text-align:left}
  table.lg td{border:1px solid #cbd5e1;padding:4px 6px}
  table.lg select{font:inherit;font-size:13px;padding:4px 6px;border:1px solid #e2e8f0;border-radius:6px;background:#fff}
  @media (max-width:760px){ .selrow{grid-template-columns:1fr 34px}.selrow b{grid-column:1/3} }  .rb{display:inline-block;font-size:13px;border:1.5px solid var(--line);border-radius:99px;padding:2px 12px;cursor:pointer;background:#fff;margin-right:4px;user-select:none}
  .rb input{display:none}.rb.on{background:var(--soft);border-color:var(--accent);color:var(--accent);font-weight:800}
  .recrow{margin-top:8px;padding:8px 10px;background:#fff;border:1px solid #99f6e4;border-radius:10px;font-size:13.5px}
  .recrow.hi{border-color:#f59e0b;background:#fffbeb}.recrow .pri{font-size:11.5px;font-weight:800;background:#e2e8f0;border-radius:99px;padding:1px 9px;margin-left:4px}
  .recrow.hi .pri{background:#fde68a;color:#92400e}
  .warn{margin-top:8px;background:#fef2f2;border:1px solid #fecaca;color:#991b1b;border-radius:10px;padding:8px 10px;font-size:13.5px;font-weight:700}
  .disc{margin-top:8px;font-size:12.5px;color:#7c2d12;background:#fff;border:1px dashed #fdba74;border-radius:10px;padding:6px 10px}
  .logstat{background:#f0fdfa;border:1px solid #99f6e4;border-radius:12px;padding:8px 12px;margin:8px 0;font-size:13.5px}  .typegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-bottom:12px}
  .tcard{font:inherit;text-align:left;border:2px solid var(--line);background:#fff;border-radius:16px;padding:8px;cursor:pointer;display:flex;flex-direction:column;gap:3px}
  .tcard canvas{width:100%;height:auto;border-radius:10px;border:1px solid #e2e8f0;background:#fff}
  .tcard b{font-size:14px;margin-top:3px}.tcard small{color:var(--sub);font-size:12px;line-height:1.35}
  .tcard:hover{border-color:#94a3b8}.tcard.on{border-color:var(--accent);background:var(--soft);box-shadow:0 0 0 2px var(--accent) inset}
  .canvascard{padding:10px 12px}.canvascard .oh2{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px;font-size:13.5px}
  .canvascard.stick{position:sticky;top:52px;z-index:4;box-shadow:0 6px 18px #0003}
  #cardCanvas{display:block;width:100%;max-height:46vh;aspect-ratio:16/9;height:auto;margin:0 auto;border:1px solid var(--line);border-radius:12px;touch-action:none;cursor:grab;background:#fff;object-fit:contain}
  .canvascard:not(.stick) #cardCanvas{max-height:none}
  .wrap.wide{max-width:1560px}
  .split{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
  .split .left{position:sticky;top:56px;z-index:3}
  .split .left .canvascard{margin-bottom:0}
  .split .left #cardCanvas{max-height:calc(100vh - 190px)}
  .split .right{min-width:0}
  table.lg .sw{width:20px;height:20px;margin-right:2px}
  @media (max-width:1000px){ .split{grid-template-columns:1fr} .split .left{top:50px} .split .left #cardCanvas{max-height:34vh} .split .left .calc{display:none} }
  @media print{ .canvascard .oh2{display:none} #cardCanvas{max-height:none} }  .catbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
  .catbar button{font:inherit;font-size:13px;border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:3px 13px;cursor:pointer}
  .catbar button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:800}
  .cgrid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
  .cwrap{position:relative;font:inherit;border:0;background:none;padding:0;cursor:pointer;border-radius:14px;transition:transform .12s}
  .cwrap:hover{transform:translateY(-3px)}
  .cwrap canvas{width:100%;height:auto;display:block;border-radius:14px;box-shadow:0 2px 8px #0002}
  .cwrap.picked canvas{box-shadow:0 0 0 4px #dc2626,0 4px 14px #dc262655}
  .cwrap.rec:not(.picked) canvas{box-shadow:0 0 0 3px #f59e0b}
  .recb,.newb{position:absolute;left:10px;bottom:10px;z-index:2;font-size:11px;font-weight:800;border-radius:99px;padding:1px 9px;color:#fff;background:#f59e0b}
  .newb{background:#7c3aed}.recb+.newb{left:56px}
  .slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
  .slot{border:2px dashed #cbd5e1;border-radius:12px;padding:8px 10px;background:#fff;font-size:13px}
  .slot.on{border:2px solid #dc2626;background:#fef2f2}
  .slot .sn{font-weight:800;margin:3px 0 6px;font-size:14px}
  .rv{display:grid;grid-template-columns:90px 200px 1fr 190px;gap:12px;border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;background:#fff;align-items:start}
  .rv.empty{grid-template-columns:90px 1fr}
  .rv .rl{font-weight:800;font-size:15px;padding-top:6px}
  .rv .rcard canvas{width:100%;height:auto;border-radius:12px;box-shadow:0 2px 8px #0002}
  .calcrow{display:flex;gap:6px;align-items:flex-end;flex-wrap:wrap}
  .calcrow label{display:flex;flex-direction:column;font-size:12px;font-weight:700;flex:1;min-width:100px}
  .calcrow label input{padding:6px 8px;font-size:14px}.calcrow label small{font-weight:500;color:var(--sub)}
  .calcrow span{font-weight:900;padding-bottom:22px;color:#64748b}
  .coach{background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:6px 10px;font-size:12.5px;margin-top:6px;color:#78350f}
  .rsales{border:2px solid #1d4ed8;border-radius:12px;padding:8px;text-align:center;font-size:13px}
  .rsales label{font-size:12px;font-weight:700;display:block;margin-bottom:3px}.rsales input{padding:5px 8px;text-align:center}
  .rsales .big{font-size:26px;font-weight:900;color:#0f172a;margin-top:4px}.rsales .big small{font-size:13px}
  .sbar{display:flex;height:34px;border-radius:10px;overflow:hidden;margin-top:6px;background:#e2e8f0}
  .sbar i{display:block;color:#fff;font-style:normal;font-size:12px;font-weight:700;line-height:34px;padding:0 6px;overflow:hidden;white-space:nowrap}
  #cardModal{display:none;position:fixed;inset:0;z-index:60}#cardModal.on{display:flex;align-items:center;justify-content:center}
  .mback{position:absolute;inset:0;background:rgba(15,23,42,.6)}
  .mbox{position:relative;background:#fff;border-radius:20px;max-width:980px;width:min(96vw,980px);max-height:92vh;overflow:auto;display:grid;grid-template-columns:360px 1fr;gap:18px;padding:22px}
  .mx{position:absolute;right:12px;top:10px;font:inherit;border:0;background:#f1f5f9;border-radius:50%;width:32px;height:32px;cursor:pointer;font-size:16px}
  .mcol canvas{width:100%;height:auto;border-radius:14px;box-shadow:0 4px 16px #0003}
  .mnav{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:13px;color:var(--sub)}
  .mtxt h3{margin:0 0 6px;font-size:21px}.mtxt p{margin:0 0 8px;font-size:14.5px}
  .mrow{border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:8px;font-size:13.5px}
  .mrow.coach{background:#fffbeb;border-color:#fde68a}
  .mact{margin-top:10px}.go2{font:inherit;font-weight:800;font-size:15px;border:0;border-radius:12px;padding:10px 20px;background:linear-gradient(90deg,#dc2626,#ea580c);color:#fff;cursor:pointer}
  details.minicv{background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px 12px;margin:10px 0}
  details.minicv summary{cursor:pointer;font-weight:800;font-size:14px;margin-bottom:6px}
  @media (max-width:900px){ .rv{grid-template-columns:1fr} .slots{grid-template-columns:1fr 1fr} .mbox{grid-template-columns:1fr} }
  @media print{ #cardModal{display:none !important} }  .rv.gwrow{grid-template-columns:90px 190px 1fr}
  .gwfields{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px}
  .gwf.wide{grid-column:1/-1}
  .gwname{font-weight:800;font-size:15px;margin-bottom:6px}
  .kwg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  .draftbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}

<script src="jszip.min.js"></script>
<script>
const KEY = "diff-workbook-v1";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const status = $("status");

// 한국어 조사 선택 (받침 유무)
const NUMBATCHIM = "0136 78".replace(" ", "");
function batchim(w){ w = String(w || "").trim().replace(/[)\]」』”’"'.!?\s]+$/, ""); const ch = w.slice(-1); if(!ch) return false; if(/[0-9]/.test(ch)) return "013678".includes(ch); const c = ch.charCodeAt(0); if(c >= 0xAC00 && c <= 0xD7A3) return (c - 0xAC00) % 28 !== 0; return /[lmnLMN]/.test(ch) && false; }
const J = (w, a, b) => w + (batchim(w) ? a : b);        // 이/가, 은/는, 을/를
const sent = s => { s = String(s || "").trim(); if(!s) return ""; return /[.!?。]$/.test(s) ? s : s + "."; };

// ───── 저장 폴더 ─────
let dirHandle = null, dirAsked = false;
const idb = () => new Promise((res, rej) => { const r = indexedDB.open("workbook-apps", 1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
async function idbGet(k){ const db = await idb(); return new Promise((res, rej) => { const q = db.transaction("kv").objectStore("kv").get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
async function idbSet(k, v){ const db = await idb(); return new Promise((res, rej) => { const q = db.transaction("kv", "readwrite").objectStore("kv").put(v, k); q.onsuccess = () => res(); q.onerror = () => rej(q.error); }); }
function dirUi(){ $("btnDir").textContent = dirHandle ? "📁 저장 폴더: " + dirHandle.name : "📁 저장 폴더 지정"; }
async function pickDir(){
  if(!window.showDirectoryPicker){ alert("이 브라우저는 폴더 지정을 지원하지 않아 파일이 ‘다운로드’ 폴더에 저장됩니다.\nChrome 또는 Edge에서 열어 주세요."); return false; }
  try { dirHandle = await showDirectoryPicker({id: "diff-v2-save", mode: "readwrite"}); await idbSet("dir-" + KEY, dirHandle); dirUi(); return true; } catch(e){ return false; }
}
(async () => { try { dirHandle = (await idbGet("dir-" + KEY)) || null; } catch(e){} dirUi(); })();
$("btnDir").onclick = pickDir;
function download(blob, name){ const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); }
async function saveFile(blob, name){
  if(!dirHandle && !dirAsked && window.showDirectoryPicker){
    dirAsked = true;
    if(confirm("저장 파일을 모아 둘 폴더를 지정할까요?\n(권장: 바이브 > 차별화 폴더. 한 번만 지정하면 이후 저장 파일이 모두 그 폴더에 만들어집니다.)")) await pickDir();
  }
  if(dirHandle){
    try {
      let p = await dirHandle.queryPermission({mode: "readwrite"});
      if(p !== "granted") p = await dirHandle.requestPermission({mode: "readwrite"});
      if(p === "granted"){ const fh = await dirHandle.getFileHandle(name, {create: true}), w = await fh.createWritable(); await w.write(blob); await w.close(); status.textContent = "✔ ‘" + dirHandle.name + "’ 폴더에 저장됨: " + name; return; }
    } catch(e){}
  }
  download(blob, name);
  status.textContent = "⬇ 다운로드 폴더에 저장됨(저장 폴더 미지정): " + name;
}

const fnm = (a, fb) => { for(const v of a){ const s = typeof v === "string" ? v.trim() : typeof v === "number" ? String(v) : ""; if(s) return s; } return fb; };
const fname = ext => `${GW.filePre}_${fnm((d.mode === "solo" ? [d.solo] : [d.team, d.members]).concat([d.author, d.brand, d.company]), "무명").replace(/[\\/:*?"<>|]/g, "")}_v${d.version || 0}.${ext}`;




// ═════════ 경쟁사 비교표 (선택) ═════════
const CMP_COLS_MIN = 1, CMP_COLS = 3, CMP_COLS_MAX = 5, CMP_ROWS_MIN = 4, CMP_ROWS_MAX = 6;
function cmpState(){
  if(!d.cmp || typeof d.cmp !== "object") d.cmp = {};
  const c = d.cmp; c.on = true;   // 경쟁사 비교표는 건너뛰기 없이 꼭 작성
  if(!Array.isArray(c.names)) c.names = []; const nc = Math.min(CMP_COLS_MAX, Math.max(CMP_COLS_MIN, c.names.length || CMP_COLS)); while(c.names.length < nc) c.names.push(""); c.names.length = nc;
  if(!Array.isArray(c.rows)) c.rows = []; while(c.rows.length < CMP_ROWS_MIN) c.rows.push({}); c.rows.length = Math.min(c.rows.length, CMP_ROWS_MAX);
  c.rows.forEach(r => { r.k = r.k || ""; r.me = r.me || ""; if(!Array.isArray(r.c)) r.c = []; while(r.c.length < nc) r.c.push(""); r.c.length = nc; r.win = !!r.win; });
  return c;
}
const cmpFilled = r => !!(clean(r.k) || clean(r.me) || r.c.some(x => clean(x)));
function cmpCols(){ const c = cmpState(), on = c.names.map((n, j) => clean(n) || c.rows.some(r => clean(r.c[j])) ? j : -1).filter(j => j >= 0); return on.length ? on : [0]; }
function cmpDoc(){
  const c = cmpState(); if(!c.on) return null; const rs = c.rows.filter(cmpFilled); if(!rs.length) return null; const cols = cmpCols();
  return {cmp: true, head: ["구분", "당사", ...cols.map(j => clean(c.names[j]) || "경쟁사" + (j + 1))], rows: rs.map(r => [(r.win ? "★ " : "") + (clean(r.k) || "-"), clean(r.me) || "-", ...cols.map(j => clean(r.c[j]) || "-")])};
}
function cmpWins(){ const c = cmpState(); return c.on ? c.rows.filter(r => r.win && clean(r.k)).map(r => clean(r.k)) : []; }
function cmpHtml(){
  const c = cmpState();
  const rows = c.rows.map((r, i) => `<tr><td><input type="text" data-cmp="r.${i}.k" value="${esc(r.k)}" placeholder="${i ? "비교요소 " + (i + 1) : "예) 가격"}"></td><td class="me"><input type="text" data-cmp="r.${i}.me" value="${esc(r.me)}" placeholder="${i ? "" : "예) 월 9,900원"}"></td>${r.c.map((v, j) => `<td><input type="text" data-cmp="r.${i}.c${j}" value="${esc(v)}" placeholder="${i ? "" : j ? "" : "예) 월 14,900원"}"></td>`).join("")}<td class="cmpb"><button type="button" class="mini ${r.win ? "on" : ""}" data-cmpact="win.${i}" title="우리가 앞서는 칸에 표시 (설명 초안에 반영)">★</button><button type="button" class="mini" data-cmpact="del.${i}" title="이 줄 지우기">✕</button></td></tr>`).join("");
  return `<p class="tip" style="margin-left:0">고른 카드가 경쟁사와 어떻게 다른지 표로 비교해요. <b>경쟁사 분석은 꼭 작성</b>해 주세요. 우리가 앞서는 줄은 <b>★</b>을 눌러 표시하면, ‘설명 초안 만들기’를 다시 눌렀을 때 설명에 반영돼요.</p>`
    + `<div class="cmpwrap"><table class="cmp"><tr><th>구분</th><th class="me">당사</th>${c.names.map((n, j) => `<th><div class="cmph"><input type="text" data-cmp="n.${j}" value="${esc(n)}" placeholder="경쟁사${j + 1}">${c.names.length > CMP_COLS_MIN ? `<button type="button" class="cmpx" data-cmpact="delcol.${j}" title="이 경쟁사 열 지우기">✕</button>` : ""}</div></th>`).join("")}<th class="cmpb">★ ✕</th></tr>${rows}</table></div>`
    + `<div class="cmpact"><button type="button" class="mini big" data-cmpact="addcol" ${c.names.length >= CMP_COLS_MAX ? "disabled" : ""}>＋ 경쟁사 추가 (${c.names.length}/${CMP_COLS_MAX})</button><button type="button" class="mini big" data-cmpact="add" ${c.rows.length >= CMP_ROWS_MAX ? "disabled" : ""}>＋ 비교요소 추가 (${c.rows.length}/${CMP_ROWS_MAX})</button><button type="button" class="mini big" data-cmpact="cards">🃏 고른 카드로 비교요소 채우기</button><button type="button" class="mini big" data-cmpact="market">🔍 시장조사·경쟁분석에서 경쟁사 가져오기</button></div>`
    + `<div class="hintline">경쟁사 이름은 직접 적거나 시장조사·경쟁분석 도우미에서 가져올 수 있어요. 경쟁사 칸에는 홈페이지·후기처럼 확인한 내용을 적어 주세요.</div>`;
}
function cmpRefresh(){ const i = GW.sections.findIndex(s => s.t === "custom"), el = document.querySelector(`.sec[data-sec="${i}"]`); if(el && i >= 0) el.outerHTML = sectionHtml(GW.sections[i], i); }
document.addEventListener("input", e => {
  const t = e.target, k = t.dataset && t.dataset.cmp; if(!k) return;
  const c = cmpState(), p = k.split("."); if(p[0] === "n") c.names[+p[1]] = t.value; else { const r = c.rows[+p[1]]; if(!r) return; if(p[2] === "k") r.k = t.value; else if(p[2] === "me") r.me = t.value; else r.c[+p[2].slice(1)] = t.value; }
  refreshAll(); persist();
});
document.addEventListener("click", e => {
  const b = e.target.closest && e.target.closest("[data-cmpact]"); if(!b) return;
  const c = cmpState(), [op, ix] = b.dataset.cmpact.split(".");
  if(op === "on") c.on = true;
  else if(op === "off") c.on = false;
  else if(op === "win") c.rows[+ix].win = !c.rows[+ix].win;
  else if(op === "del"){ if(c.rows.length > CMP_ROWS_MIN) c.rows.splice(+ix, 1); else c.rows[+ix] = {}; }
  else if(op === "add"){ if(c.rows.length >= CMP_ROWS_MAX) return; c.rows.push({}); }
  else if(op === "addcol"){ if(c.names.length >= CMP_COLS_MAX) return; c.names.push(""); }
  else if(op === "delcol"){ if(c.names.length <= CMP_COLS_MIN) return; c.names.splice(+ix, 1); c.rows.forEach(r => r.c.splice(+ix, 1)); }
  else if(op === "cards"){
    const cs = d.rows.filter(r => r.id !== null).map(r => cardOf(r)).filter(Boolean); if(!cs.length){ alert("먼저 1단계에서 차별화 카드를 고르면 비교요소를 채워 드려요."); return; }
    (cs.some(x => x.cat === "포지셔닝") ? cs.filter(x => x.cat === "포지셔닝") : cs).forEach(cd => { const lb = "‘" + cd.n + "’ 측면"; if(c.rows.some(r => clean(r.k) === lb)) return; let r = c.rows.find(x => !clean(x.k)); if(!r){ if(c.rows.length >= CMP_ROWS_MAX) return; r = {}; c.rows.push(r); } r.k = lb; });
  }
  else if(op === "market"){
    let comp = []; try { comp = (JSON.parse(localStorage.getItem("ss-pub-market") || "{}").comp || []).map(x => String(x || "").trim()).filter(Boolean); } catch(e){}
    if(!comp.length){ alert("시장조사·경쟁분석 도우미에 입력한 경쟁사가 아직 없어요.\n경쟁사 이름은 표에 직접 적어도 돼요."); return; }
    let j = 0; comp.forEach(n => { if(c.names.some(x => clean(x) === n)) return; while(j < c.names.length && clean(c.names[j])) j++; if(j >= c.names.length && c.names.length < CMP_COLS_MAX){ c.names.push(""); cmpState(); } if(j < c.names.length) c.names[j] = n; });
  }
  cmpState(); cmpRefresh(); refreshAll(); persist();
});

// ═════════ 차별화 ═════════
const PAL = [["#b45309", "#fde68a"], ["#0369a1", "#bae6fd"], ["#be185d", "#fbcfe8"], ["#0f766e", "#99f6e4"], ["#7c3aed", "#ddd6fe"], ["#475569", "#e2e8f0"]];
const GW = {
  id: "diff", filePre: "차별화결과시트", tag: "차별화", frame: "#f59e0b", noun: "차별화 카드", sheetTitle: "차별화 결과 시트", sheetSub: "아이디어 · 아이템 설명", minCards: 1,
  intro: `차별화는 <b>“경쟁 제품과 어떻게 달라질까”</b>를 찾는 일이에요. 카드가 60장이나 되니 <b>위쪽 분류 버튼으로 걸러 보고, 마음에 드는 카드를 눌러 설명을 확인</b>한 뒤 최대 4개를 고르세요. 한 장씩 넘겨 볼 필요는 없어요.`,

async function makeDocx(){
  const run = (t, o = {}) => `<w:r><w:rPr><w:rFonts w:ascii="맑은 고딕" w:eastAsia="맑은 고딕" w:hAnsi="맑은 고딕"/>${o.b ? "<w:b/>" : ""}<w:sz w:val="${o.sz || 20}"/></w:rPr>${String(t ?? "").split("\n").map((l, i) => `${i ? "<w:br/>" : ""}<w:t xml:space="preserve">${esc(l)}</w:t>`).join("")}</w:r>`;

  const D = docBlocks(), png = await sheetBlob(), buf = await png.arrayBuffer(), cx = 6480000, cy = Math.round(cx * 900 / 1600);
  const media = [], drawing = (rid, w, h, name) => `<w:p><w:pPr><w:jc w:val="center"/></w:pPr><w:r><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0"><wp:extent cx="${w}" cy="${h}"/><wp:docPr id="${media.length + 1}" name="${name}"/><a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:nvPicPr><pic:cNvPr id="0" name="${name}"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="${rid}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${w}" cy="${h}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r></w:p>`;

  for(const t of (D.tables || [])){ const k = t.head.length, w = t.widths || Array.from({length: k}, (_, i) => i === k - 1 ? W - Math.floor(W / k) * (k - 1) : Math.floor(W / k)); body += para(" ") + tbl([t.head, ...t.rows.map(r => r.map(c => String(c ?? "") || "-"))], w, true); }
  for(const im of (D.images || []).filter(x => x.src)){ const raw = im.src.split(",")[1], ext = /jpeg/.test(im.src) ? "jpg" : "png", rid = "rId" + (10 + media.length), bin = Uint8Array.from(atob(raw), ch => ch.charCodeAt(0)); media.push({rid, name: "img" + media.length + "." + ext, data: bin.buffer}); body += para(im.title, {b: 1, sz: 22, before: 160}) + drawing(rid, 5400000, 3375000, "img"); }
  for(const t of (D.texts || [])) body += para(t.title, {b: 1, sz: 22, before: 160}) + tbl([[clean(t.text) || " "]], [W]);
  const zip = new JSZip();
  zip.file("[Content_Types].xml", '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Default Extension="png" ContentType="image/png"/><Default Extension="jpg" ContentType="image/jpeg"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>');

  .room::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(1.6px 1.6px at 12% 18%,#fff9,transparent 60%),radial-gradient(1.4px 1.4px at 38% 64%,#fff8,transparent 60%),radial-gradient(1.8px 1.8px at 63% 22%,#ffe9a8cc,transparent 60%),radial-gradient(1.4px 1.4px at 82% 71%,#fff8,transparent 60%),radial-gradient(1.2px 1.2px at 91% 12%,#fff8,transparent 60%),radial-gradient(1.6px 1.6px at 24% 88%,#ffe9a8aa,transparent 60%),radial-gradient(1.2px 1.2px at 52% 8%,#fff8,transparent 60%),radial-gradient(1.4px 1.4px at 74% 44%,#fff7,transparent 60%);animation:twinkle 4s ease-in-out infinite alternate}
  @keyframes twinkle{from{opacity:.55}to{opacity:1}}

  .room.r-trophy{background:radial-gradient(ellipse at 50% -10%,#1d5a73 0%,#0e3347 55%,#071b27 100%)}
  .room.r-safe{background:radial-gradient(ellipse at 50% -10%,#4b5568 0%,#2a303d 55%,#161a23 100%)}
  .room.r-toolbox{background:radial-gradient(ellipse at 50% -10%,#57534e 0%,#2e2a27 55%,#171413 100%)}
  .room.light{box-shadow:inset 0 0 0 3px #fff,inset 0 0 26px #0001}
  .room.light::before{display:none}
  .room.r-drawer{background:linear-gradient(160deg,#eef2f7 0%,#d9e1ec 55%,#c5d0df 100%)}
  .room.r-firstaid{background:linear-gradient(160deg,#f2fdf7 0%,#d5f5e3 60%,#bfeed5 100%)}
  .room.r-mapcase{background:linear-gradient(160deg,#fbf0d2 0%,#f1dcaa 60%,#e5c98a 100%)}
  .room.r-capsule{background:radial-gradient(circle at 12% 18%,#fff 0 3px,transparent 4px),radial-gradient(circle at 70% 12%,#fff8 0 4px,transparent 5px),radial-gradient(circle at 90% 70%,#fff8 0 3px,transparent 4px),linear-gradient(160deg,#fff4d6 0%,#ffe1ef 45%,#dfe6ff 100%)}
  .room .rtip{position:relative;color:#ffe9a8;font-size:13.5px;margin:0 0 10px;text-align:center;font-weight:700;letter-spacing:.01em}

  .room.r-capsule .cgrid3{gap:30px 8px;padding-top:26px}
  .chest{position:relative;font:inherit;border:0;background:none;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:0;color:#fff;animation:chestPop .38s both;animation-delay:calc(var(--n) * 14ms);-webkit-tap-highlight-color:transparent}

  .room.light .csvg{filter:drop-shadow(0 6px 5px #0003)}

  .chest .lid{transform-origin:34px 90px}

  .chest .gem{opacity:0;transform:translateY(26px) scale(.5);transform-origin:100px 62px}

  /* 종류별 뚜껑 움직임 */
  .ct-safe .lid{transform-origin:40px 100px}
  .ct-safe:hover:not(.open) .lid{transform:scaleX(.93)}
  .ct-safe.open .lid,.ct-safe.opening .lid{transform:scaleX(.14)}
  .ct-safe.seen:not(.open) .lid{transform:scaleX(.9)}
  .ct-drawer .lid,.ct-lockdrawer .lid{transform-origin:100px 90px}
  .ct-drawer:hover:not(.open) .lid,.ct-lockdrawer:hover:not(.open) .lid{transform:translateY(-3px)}
  .ct-drawer.open .lid,.ct-drawer.opening .lid,.ct-lockdrawer.open .lid,.ct-lockdrawer.opening .lid{transform:translateY(17px) scale(1.04)}
  .ct-drawer.seen:not(.open) .lid,.ct-lockdrawer.seen:not(.open) .lid{transform:translateY(5px)}

  .ct-capsule.open,.ct-capsule.opening{z-index:3}
  .chest.opening::after{content:"";position:absolute;left:50%;top:38%;width:20px;height:20px;margin:-10px;border-radius:50%;background:radial-gradient(circle,#fff 0%,#ffe9a8 35%,transparent 70%);animation:burst .45s ease-out forwards;pointer-events:none}

  .chest .nm{margin-top:-2px;background:linear-gradient(#3a2610,#241505);color:#ffe9a8;border:1.5px solid #c9a227;border-radius:9px;padding:3px 8px;font-weight:800;font-size:13.5px;line-height:1.25;min-width:84%;min-height:2.3em;display:flex;align-items:center;justify-content:center;text-align:center;box-shadow:0 2px 5px #0007}

  .room.r-capsule .chest .nm{border-radius:99px;padding:3px 12px;min-height:0}
  .chest .ct{margin-top:4px;font-size:11px;font-weight:800;border-radius:99px;padding:0 9px;color:#fff;background:var(--c1);box-shadow:0 1px 3px #0006}
  .chest .rb{position:absolute;top:2px;left:4px;background:#f59e0b;color:#fff;border-radius:99px;padding:1px 8px;font-weight:800;font-size:11px;box-shadow:0 2px 6px #0006;z-index:2}
  .chest .bd{position:absolute;top:2px;right:4px;background:#dc2626;color:#fff;border-radius:99px;padding:1px 9px;font-weight:800;font-size:12px;box-shadow:0 2px 6px #0008;z-index:2}
  .chest.seen:not(.open) .lid{transform:translate(-4px,-10px) rotate(-6deg)}
  .chest.seen:not(.open) .lock{opacity:.35}
  .chest.seen .nm::before{content:"✓ ";color:#86efac}
  .room.light .chest.seen .nm::before{color:#16a34a}
  .chest.picked .csvg{filter:drop-shadow(0 0 10px #ffd34d) drop-shadow(0 6px 6px #0006)}
  .chest.picked .nm{border-color:#fde047;box-shadow:0 0 0 2px #dc2626,0 2px 8px #0008}
  .room.light .chest.picked .nm{border-color:var(--c1);box-shadow:0 0 0 3px #dc2626,0 2px 8px #0003}
  .chest:focus-visible{outline:3px solid #fde047;outline-offset:3px;border-radius:12px}
  .room.light .chest:focus-visible{outline-color:#7c3aed}
  .skinbtn{margin-left:auto}
  @media (prefers-reduced-motion:reduce){.chest,.room::before,.chest .gem,.ct-capsule:hover .csvg{animation:none!important}.chest .lid,.chest .lock,.chest .gem,.chest .glow,.chest .cbot{transition:none!important}}
</style>

<script>
(function(){
  const CF = window.SKINCFG || {box: "chest", shape: "shield"}, REV = !!CF.rev, ID = REV ? "rev" : GW.id;
  const SK = ID + "-skin", SD = ID + "-sound", SN = ID + "-seen";
  const ls = { get: k => { try { return localStorage.getItem(k); } catch(e){ return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch(e){} } };
  const EMOF = "'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif";
  // ───── 보관함 종류 ─────
  // 수익구조 앱은 카드 구조가 달라(c.name, 번호 카드) 접근 함수로 맞춰 쓴다
  const CT = REV ? CATS : CATC, CI = c => REV ? CATI[c.cat] : catIdx(c), NM = c => REV ? c.name : c.n, TAGT = REV ? "수익구조" : GW.tag, BG = s => REV ? (SLOTS[s] || "") : badgeOf(s), CID = (c, i) => REV ? c.id : i;
  const BOX = {
    chest:     {nm: "보물함",   e: "🗝️", unit: "상자", tip: "🗝️ 상자를 누르면 열려요 — 안에서 카드 설명이 나타나요", room: "r-chest"},
    jewel:     {nm: "보석함",   e: "💎", unit: "보석함", tip: "💎 보석함을 누르면 열려요 — 안에서 카드 설명이 나타나요", room: "r-jewel"},
    trophy:    {nm: "진열장",   e: "🏆", unit: "진열장", tip: "🏆 진열장을 누르면 열려요 — 안에서 카드 설명이 나타나요", room: "r-trophy"},
    drawer:    {nm: "서류함",   e: "🗂️", unit: "서랍", tip: "🗂️ 서랍을 누르면 열려요 — 안에서 카드 설명이 나타나요", room: "r-drawer", light: 1},
    lockdrawer:{nm: "잠금 서랍", e: "🔐", unit: "서랍", tip: "🔐 잠긴 서랍을 누르면 열려요 — 안에서 카드 설명이 나타나요", room: "r-drawer", light: 1},
    safe:      {nm: "금고",     e: "🔐", unit: "금고", tip: "🔐 금고를 누르면 열려요 — 안에서 카드 설명이 나타나요", room: "r-safe"},
    firstaid:  {nm: "구급함",   e: "⛑️", unit: "구급함", tip: "⛑️ 구급함을 누르면 열려요 — 안에서 카드 설명이 나타나요", room: "r-firstaid", light: 1},
    toolbox:   {nm: "공구상자", e: "🧰", unit: "공구상자", tip: "🧰 공구상자를 누르면 열려요 — 안에서 카드 설명이 나타나요", room: "r-toolbox"},
    mapcase:   {nm: "지도통",   e: "🗺️", unit: "지도통", tip: "🗺️ 지도통을 누르면 열려요 — 안에서 카드 설명이 나타나요", room: "r-mapcase", light: 1},
    capsule:   {nm: "캡슐",     e: "💊", unit: "캡슐", tip: "💊 캡슐을 누르면 열려요 — 안에서 카드 설명이 나타나요", room: "r-capsule", light: 1}
  };
  let BX = BOX[CF.box] || BOX.chest;
  const josa = w => { const c = w.charCodeAt(w.length - 1) - 0xAC00; return (c >= 0 && c % 28 !== 0 && c % 28 !== 8) ? "으로" : "로"; };
  // ───── 카드 모양(캔버스) ─────
  const GOLD = ["#fff3b0", "#f2c230", "#b8860b", "#8a6508"], SILV = ["#ffffff", "#cbd5e1", "#64748b", "#475569"], REDR = ["#fecaca", "#ef4444", "#991b1b", "#7f1d1d"], BRWN = ["#e9c88a", "#b9863f", "#7a4f1d", "#5c3a12"];
  const poly = (g, pts) => { g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.closePath(); };
  const PATH = {
    shield: (g, cx, t, W, H) => { g.beginPath(); g.moveTo(cx - W / 2, t); g.lineTo(cx + W / 2, t); g.lineTo(cx + W / 2, t + H * .52); g.quadraticCurveTo(cx + W / 2, t + H * .88, cx, t + H); g.quadraticCurveTo(cx - W / 2, t + H * .88, cx - W / 2, t + H * .52); g.closePath(); },
    crest:  (g, cx, t, W, H) => poly(g, [[cx - W / 2, t + H * .17], [cx, t], [cx + W / 2, t + H * .17], [cx + W / 2, t + H * .8], [cx, t + H], [cx - W / 2, t + H * .8]]),
    circle: (g, cx, t, W, H) => { g.beginPath(); g.ellipse(cx, t + H / 2, W / 2, H / 2, 0, 0, 7); },
    stamp:  (g, cx, t, W, H) => { g.beginPath(); for(let k = 0; k <= 96; k++){ const a = k / 96 * Math.PI * 2, r = 1 + .04 * Math.cos(a * 16); const px = cx + Math.cos(a) * W / 2 * r, py = t + H / 2 + Math.sin(a) * H / 2 * r; k ? g.lineTo(px, py) : g.moveTo(px, py); } g.closePath(); },
    gem:    (g, cx, t, W, H) => poly(g, [[cx - W * .3, t], [cx + W * .3, t], [cx + W / 2, t + H * .2], [cx + W / 2, t + H * .8], [cx + W * .3, t + H], [cx - W * .3, t + H], [cx - W / 2, t + H * .8], [cx - W / 2, t + H * .2]]),
    hex:    (g, cx, t, W, H) => poly(g, [[cx - W * .25, t], [cx + W * .25, t], [cx + W / 2, t + H / 2], [cx + W * .25, t + H], [cx - W * .25, t + H], [cx - W / 2, t + H / 2]]),
    rect:   (g, cx, t, W, H, r) => { g.beginPath(); const x = cx - W / 2, rd = r || W * .04; g.moveTo(x + rd, t); g.arcTo(x + W, t, x + W, t + H, rd); g.arcTo(x + W, t + H, x, t + H, rd); g.arcTo(x, t + H, x, t, rd); g.arcTo(x, t, x + W, t, rd); g.closePath(); }
  };
  // W,H는 카드 너비(w)에 대한 비율. ty=분류 글자 위치, iy=그림 위치, ny=이름 위치, cy=분류 이름 위치, nw=이름 최대폭 비율, is=그림 크기 비율
  const SHP = {
    shield: {p: PATH.shield, W: .82, H: 1.0, rim: GOLD, ty: .145, iy: .47, ny: .76, cy: .85, nw: .82, is: .42},
    crest:  {p: PATH.crest,  W: .82, H: 1.0, rim: GOLD, ty: .19, iy: .47, ny: .77, cy: .86, nw: .84, is: .36},
    coin:   {p: PATH.circle, W: .9,  H: .9,  rim: GOLD, ty: .17, iy: .43, ny: .71, cy: .83, nw: .78, is: .34},
    medal:  {p: PATH.circle, W: .76, H: .76, rim: GOLD, ty: .17, iy: .43, ny: .71, cy: .83, nw: .78, is: .34, top: .3, ribbon: 1},
    stamp:  {p: PATH.stamp,  W: .88, H: .88, rim: REDR, ty: .17, iy: .43, ny: .71, cy: .83, nw: .78, is: .34},
    cross:  {p: PATH.circle, W: .9,  H: .9,  rim: REDR, ty: .17, iy: .43, ny: .71, cy: .83, nw: .78, is: .34, cross: 1},
    gem:    {p: PATH.gem,    W: .84, H: .96, rim: SILV, ty: .15, iy: .46, ny: .75, cy: .85, nw: .84, is: .36, facets: 1},
    hexgem: {p: PATH.hex,    W: .94, H: .88, rim: SILV, ty: .16, iy: .44, ny: .73, cy: .84, nw: .72, is: .32, facets: 1},
    scroll: {p: PATH.rect,   W: .74, H: .8,  rim: BRWN, ty: .15, iy: .45, ny: .73, cy: .84, nw: .84, is: .34, scroll: 1, paper: "#fff6dc"},
    tag:    {p: PATH.rect,   W: .78, H: .98, rim: SILV, ty: .20, iy: .49, ny: .76, cy: .86, nw: .84, is: .36, hole: 1}
  };
  let SH = SHP[CF.shape] || SHP.shield;
  window.drawCard = function(g, c, x, y, w, o){
    o = o || {}; const cat = CT[CI(c)], cx = x + w / 2, EM = EMOF, FN = "'Malgun Gothic','Apple SD Gothic Neo',sans-serif";
    const sw = w * SH.W, sh = w * SH.H, top = y + (SH.top !== undefined ? w * SH.top : (w * 1.06 - sh) / 2);
    const R = SH.rim, holeY = top + sh * .075;

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>아이데이션 GUIDE (활동 보고서)</title>
<style>
  :root{ --bg:#eef3f8; --card:#fff; --ink:#16202e; --sub:#586579; --line:#d6dde9; --accent:#2563eb; --soft:#e8f0ff; --good:#15803d; --warn:#b45309; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",sans-serif;line-height:1.6}
  header{background:#0f2a4a;color:#fff;padding:10px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
  header h1{margin:0;font-size:17px}
  header .sp{flex:1}
  header .st{font-size:12.5px;color:#b7c9e6}
  header button,header label.btn{font:inherit;font-size:12.5px;padding:5px 10px;border-radius:8px;border:1px solid #2d4f7c;background:#173a64;color:#fff;cursor:pointer;font-weight:600}
  .steps{display:flex;gap:8px;max-width:980px;margin:14px auto 0;padding:0 16px}
  .steps button{flex:1;font:inherit;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:9px 14px;cursor:pointer}
  .steps button b{display:block;font-size:14px}
  .steps button small{color:var(--sub);font-size:12px}
  .steps button.on{border-color:var(--accent);background:var(--soft)}
  .steps button.done b::after{content:" ✓";color:var(--good)}
  .wrap{max-width:980px;margin:0 auto;padding:12px 16px 90px}
  .prog{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--sub);margin:10px 0}
  .prog .bar{flex:1;height:8px;background:#dbe5f2;border-radius:99px;overflow:hidden}
  .prog .bar i{display:block;height:100%;background:linear-gradient(90deg,#2563eb,#7c3aed);width:0;transition:width .3s}
  .intro{background:#fff7ed;border:1px solid #fed7aa;border-radius:14px;padding:10px 14px;font-size:13.5px;color:#9a3412;margin-bottom:12px}
  .intro button{font:inherit;font-size:12.5px;font-weight:700;margin-left:6px;padding:3px 10px;border-radius:8px;border:1px solid #fdba74;background:#fff;cursor:pointer;color:#9a3412}
  .card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin-bottom:14px;box-shadow:0 3px 12px #2563eb10}
  .card h2{margin:0 0 4px;font-size:18px;display:flex;align-items:center;gap:10px}
  .card h2 .n{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:15px;flex:none}
  .card.done h2 .n{background:var(--good)}
  .tip{font-size:13px;color:var(--sub);margin:0 0 12px 40px}
  .q{margin-bottom:11px}
  .q>label{display:block;font-size:13.5px;font-weight:800;margin-bottom:4px}
  .q>label small{font-weight:500;color:var(--sub)}
  input[type=text],input[type=number],textarea{font:inherit;width:100%;border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;background:#f8fafc;color:var(--ink);font-size:14.5px}
  textarea{min-height:84px;resize:vertical}
  input:focus,textarea:focus{outline:2px solid #2563eb55;border-color:var(--accent)}
  .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
  .chips span{font-size:11.5px;font-weight:800;color:#7c3aed;align-self:center}
  .chips button{font:inherit;font-size:12px;border:1px dashed #a78bfa;background:#f5f3ff;color:#5b21b6;padding:2px 10px;border-radius:99px;cursor:pointer}
  .chips button:hover{background:#ede9fe}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .row4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .fn{border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:#fbfcff;margin-bottom:8px}
  .fn b{font-size:12.5px;color:var(--accent)}
  .tags{display:flex;flex-wrap:wrap;gap:6px}
  .tags label{font-size:13px;border:1.5px solid var(--line);border-radius:99px;padding:3px 12px;cursor:pointer;background:#fff;user-select:none}
  .tags input{display:none}
  .tags label.on{background:var(--soft);border-color:var(--accent);color:var(--accent);font-weight:800}
  .out{background:linear-gradient(135deg,#eff6ff,#f5f3ff);border:1px solid #c7d2fe;border-radius:14px;padding:10px 12px;margin-top:6px}
  .out .oh{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:800;color:#4338ca;margin-bottom:4px}
  .out .oh span{margin-left:auto;font-weight:600;color:var(--sub)}
  .out .oh button{font:inherit;font-size:12px;padding:2px 10px;border-radius:8px;border:1px solid #a5b4fc;background:#fff;cursor:pointer;font-weight:700;color:#4338ca}
  .out textarea{background:#fff;min-height:96px}
  .out .oh .hb2{background:linear-gradient(90deg,#2563eb,#7c3aed);color:#fff;border:0}
  .helper{margin-top:8px;background:#fff;border:1.5px solid #c7d2fe;border-radius:14px;padding:10px 12px}
  .helper .hh{font-weight:800;font-size:13.5px;color:#4338ca;margin-bottom:6px}
  .helper .hc{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
  .helper .hc span{background:#eef2ff;border-radius:99px;padding:2px 11px;font-size:12px}
  .helper .hc b{color:#4338ca;margin-right:4px}
  .helper .hb{font-size:12.5px;color:#92400e;background:#fffbeb;border-radius:8px;padding:5px 10px;margin-bottom:6px}
  .helper .hd{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:3px}
  .helper .hd button,.helper .vr button{font:inherit;font-size:12px;font-weight:700;padding:3px 12px;border-radius:8px;border:1px solid #a5b4fc;background:#eef2ff;color:#4338ca;cursor:pointer;margin-left:auto}
  .helper .hd .ok{margin-left:auto;font-size:12px;color:var(--good);font-weight:700}
  .helper pre{margin:0;white-space:pre-wrap;word-break:break-word;font:inherit;font-size:13.5px;background:#f8fafc;border-radius:10px;padding:8px 10px}
  .helper .vr{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .helper .vr button{margin-left:0}
  .helper .vt{font-size:12px;color:var(--sub);margin-top:4px}
  .helper .hk{font-size:12.5px;background:#fff7ed;border-radius:10px;padding:6px 10px;margin-top:8px;color:#9a3412}
  .helper .hk.good{background:#f0fdf4;color:#166534}
  .hintline{font-size:12.5px;margin-top:4px;color:var(--warn)}
  .hintline.ok{color:var(--good)}
  .calc{background:#f0fdfa;border:1px solid #99f6e4;border-radius:12px;padding:10px 12px;margin:6px 0 10px}
  .calc .big{font-size:18px;font-weight:900;color:#0f766e}
  .doc{background:#fff;border:1px solid #cbd5e1;box-shadow:0 4px 16px #0002;padding:22px 26px;margin:8px 0 16px;font-size:13px}
  .doc h3{text-align:center;font-size:20px;margin:0 0 10px;letter-spacing:.2em}
  .doc table{border-collapse:collapse;width:100%}
  .doc td,.doc th{border:1px solid #444;padding:6px 8px;vertical-align:top;text-align:left}
  .doc th{background:#e9ecef;font-size:13px}
  .doc td.a{min-height:70px;white-space:pre-wrap;word-break:break-word;font-size:12.5px}
  .doc td.empty{color:#aaa}
  .final{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
  .final button{font:inherit;font-weight:800;padding:12px 22px;border-radius:12px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:15px}
  .final .go{background:linear-gradient(90deg,#2563eb,#7c3aed);color:#fff;border:0;font-size:16px;box-shadow:0 6px 18px #4f46e544}
  .chk{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:6px;margin:8px 0}
  .chk div{font-size:13px;padding:5px 10px;border-radius:10px;background:#f1f5f9}
  .chk div.ok{background:#dcfce7;color:#166534} .chk div.no{background:#fee2e2;color:#991b1b}
  nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 16px;display:flex;justify-content:center;gap:10px;z-index:5}
  nav .in{max-width:980px;width:100%;display:flex;gap:10px;align-items:center}
  nav button{font:inherit;font-weight:800;padding:10px 26px;border-radius:12px;border:1px solid var(--line);background:#fff;cursor:pointer}
  nav button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  nav button:disabled{opacity:.35;cursor:default}
  nav .mid{flex:1;text-align:center;font-size:13px;color:var(--sub)}
  @media (max-width:760px){ .row2,.row3,.row4{grid-template-columns:1fr} .steps{flex-direction:column} .tip{margin-left:0} }
  .plancard{border:2px solid #0f766e} .srcstat{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.srcstat span,#planView .pst i{font-style:normal;font-size:12.5px;padding:3px 9px;border-radius:99px;border:1px solid #cbd5e1;background:#fff}.srcstat .ok,#planView .pst .ok{color:#0f766e;border-color:#0f766e}.srcstat .no,#planView .pst .no{color:#b45309;border-color:#d97706}.btnlike{display:inline-block;padding:9px 14px;border:1px solid #94a3b8;border-radius:8px;background:#fff;cursor:pointer;font-size:14px}
  #planView{display:none;position:fixed;inset:0;z-index:50;background:#e5e7eb;overflow:auto}#planView.on{display:block}
  #planView .pbar{position:sticky;top:0;z-index:2;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px;background:#fff;border-bottom:1px solid #cbd5e1}#planView .pst{display:flex;flex-wrap:wrap;gap:5px}
  #planView .pdoc{max-width:860px;margin:18px auto;background:#fff;padding:36px 44px;box-shadow:0 2px 12px rgba(0,0,0,.15);font-size:14px;line-height:1.7;color:#111}
  .ptitle{text-align:center;font-size:24px;margin:0 0 6px}.pnote{font-size:12px;color:#b45309;margin-bottom:14px;text-align:center}
  .ph1{font-size:17px;margin:22px 0 8px;padding:6px 10px;background:#dde7f0;color:#0f3d63;border-radius:4px}.ph2{font-size:15px;margin:14px 0 4px;color:#0f766e}.ph3{font-size:14px;margin:10px 0 3px}
  .pp{border:1px solid #888;padding:8px 10px;white-space:pre-wrap;word-break:keep-all}.pp.pe{color:#999;background:#fafafa}
  .ptb{width:100%;border-collapse:collapse;margin:6px 0;font-size:13px}.ptb th,.ptb td{border:1px solid #888;padding:5px 8px;text-align:left;vertical-align:top;white-space:pre-wrap}.ptb th{background:#e9ecef}.ptb.kv th{width:22%}
  @media print{ body.plan-open > *:not(#planView){display:none !important} #planView{position:static;background:#fff;overflow:visible;display:block !important} #planView .pbar{display:none} #planView .pdoc{box-shadow:none;margin:0;padding:0;max-width:none} .ph1,.ph2,.ph3{break-after:avoid} .ptb tr,.pp{break-inside:avoid} }
  @media print{ header,.steps,.prog,.intro,.card,nav,.final,.chk,.nodoc{display:none !important} body{background:#fff} .wrap{padding:0;max-width:none} .doc{border:0;box-shadow:none;padding:0;margin:0} @page{size:A4;margin:14mm} }
  #ver{background:#dc2626;color:#fff;border-radius:99px;padding:2px 11px;font-size:12.5px;font-weight:700;white-space:nowrap}
</style>
</head>
<body>
<header>
  <h1>💭 아이데이션 GUIDE</h1><span class="st" id="status">자동 저장됨</span>
  <span class="sp"></span>
  <button id="btnPlan" data-plan="open" style="background:linear-gradient(90deg,#0369a1,#7c3aed);color:#fff;border:0;font-weight:700">📑 사업계획서 미리보기</button>
  <button id="btnDir">📁 저장 폴더 지정</button>
  <button id="btnSave">💾 파일로 저장</button>
  <label class="btn">📂 불러오기<input type="file" id="fileLoad" accept=".json" hidden></label>
  <button id="btnReset">🗑 새로 시작</button>
  <span id="ver" title="파일로 저장할 때마다 1씩 올라갑니다">v0</span>
</header>
<div class="steps" id="steps"></div>
<div class="wrap">
  <div class="prog"><span id="progtxt"></span><div class="bar"><i id="progbar"></i></div></div>
  <div id="page"></div>
</div>
<nav><div class="in"><button id="prev">← 이전</button><span class="mid" id="mid"></span><button id="next" class="primary">다음 →</button></div></nav>

<script src="jszip.min.js"></script>
<script>
const KEY = "problem-helper-v1";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const status = $("status");

// 한국어 조사 선택 (받침 유무)
const NUMBATCHIM = "0136 78".replace(" ", "");
function batchim(w){ w = String(w || "").trim().replace(/[)\]」』”’"'.!?\s]+$/, ""); const ch = w.slice(-1); if(!ch) return false; if(/[0-9]/.test(ch)) return "013678".includes(ch); const c = ch.charCodeAt(0); if(c >= 0xAC00 && c <= 0xD7A3) return (c - 0xAC00) % 28 !== 0; return /[lmnLMN]/.test(ch) && false; }
const J = (w, a, b) => w + (batchim(w) ? a : b);        // 이/가, 은/는, 을/를
const sent = s => { s = String(s || "").trim(); if(!s) return ""; return /[.!?。]$/.test(s) ? s : s + "."; };

// ───── 항목 정의 (첨부 양식의 순서·제목 그대로) ─────
const ITEMS = [
 {no:1, title:"아이템을 생각하게 된 동기(이유/계기)", tip:"‘왜 이 아이템이 떠올랐는지’를 이야기처럼 풀어 쓰는 칸이에요. 아래 4개 질문에 짧게만 답하면 문장이 자동으로 만들어집니다.", out:"m_text",
  qs:[["m_when","① 언제, 어디서 문제를 발견했나요?","예) 점심시간에 학교 식당 앞에서",["등굣길 버스 정류장에서","집에서 가족을 도와드리다가","아르바이트를 하면서","여행을 가서"]],
      ["m_who","② 누가 불편을 겪었나요?","예) 저와 친구들이",["저와 가족이","같은 학과 친구들이","동네 어르신들이","직장인들이"]],
      ["m_pain","③ 어떤 불편·손해가 있었나요? (숫자가 있으면 더 좋아요)","예) 줄을 25분씩 서야 했고 고를 수 있는 메뉴도 적었습니다",["시간이 오래 걸렸습니다(N분)","비용이 부담되었습니다(N원)","원하는 것을 구하기 어려웠습니다","안전·위생이 걱정되었습니다"]],
      ["m_why","④ 그래서 어떤 생각이 들었나요?","예) 누구나 빠르게 해결할 수 있는 서비스가 필요하다고 생각했습니다",["직접 해결해 보고 싶었습니다","비슷한 어려움을 겪는 사람이 많을 것이라고 생각했습니다","더 나은 방법이 있을 것이라고 느꼈습니다"]]]},
 {no:2, title:"아이템(아이디어)에 포함해야 할 중요한 기능(장점)", tip:"기능은 ‘이름’, 장점은 ‘고객이 얻는 이익’으로 나눠 적으면 쉬워요. 3개까지 적어 보세요(1개만 필수).", out:"f_text", custom:"features"},
 {no:3, title:"비슷하거나 개선해야 할 기존 아이템의 문제점/불편한점/애로사항", tip:"지금 사람들이 쓰는 비슷한 제품·서비스를 먼저 떠올리고, 어떤 점이 아쉬운지 골라 보세요.", out:"p_text", custom:"existing"},
 {no:4, title:"해결방안", tip:"3번에서 찾은 문제 하나하나에 ‘우리는 이렇게 해결한다’를 짝지어 적으면 논리가 깔끔해져요.", out:"s_text", custom:"solution"},
 {no:5, title:"진출하고자 하는 시장의 규모와 구매할 고객은?", tip:"‘누가 살지’ 그리고 ‘시장이 얼마나 클지’를 간단한 곱셈으로 추정해 보는 칸이에요. 계산기가 도와드려요.", out:"c_text", custom:"market"},
 {no:6, title:"아이템(아이디어) OSP", tip:"OSP는 One Sentence Pitch, 즉 ‘한 문장 소개’예요. 네 칸만 채우면 한 문장이 완성됩니다.", out:"o_text", custom:"osp"}
];
const PAGES = [
 {name:"1단계", sub:"기본 정보 · 동기 · 중요한 기능", items:[0, 1], head:true},
 {name:"2단계", sub:"기존 아이템의 문제점 · 해결방안", items:[2, 3]},
 {name:"3단계", sub:"시장·고객 · OSP · 문서 저장", items:[4, 5], last:true}
];
const PROBLEM_TAGS = [["가격이 비싸요","가격이 비싼 점"],["사용법이 복잡해요","사용법이 복잡한 점"],["품질·성능이 부족해요","품질·성능이 부족한 점"],["시간이 오래 걸려요","시간이 오래 걸리는 점"],["구하기·찾기 어려워요","구하거나 찾기 어려운 점"],["내게 맞는 맞춤이 안 돼요","내게 맞는 맞춤 선택이 어려운 점"],["안전·위생이 걱정돼요","안전·위생이 걱정되는 점"],["디자인·재미가 부족해요","디자인·재미가 부족한 점"],["서비스·응대가 불친절해요","서비스·응대가 불친절한 점"],["환경에 부담이 돼요","환경에 부담이 되는 점"]];
const tagPhrase = l => (PROBLEM_TAGS.find(x => x[0] === l) || [l, l])[1];

// ───── 데이터 ─────
const FIELDS = ["team","members","solo","item","m_when","m_who","m_pain","m_why","m_text","f1n","f1b","f2n","f2b","f3n","f3b","f_why","f_text","e1","e2","p_detail","p_text","s_key","sp1","ss1","sp2","ss2","sp3","ss3","s_text","c_who","c_pop","c_pct","c_buy","c_price","c_src","c_text","o_cust","o_prob","o_how","o_eff","o_text"];
function load(){ try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ return {}; } }
let d = load();
function ensure(){ FIELDS.forEach(k => { if(d[k] === undefined) d[k] = ""; }); d.mode = d.mode === "solo" ? "solo" : "team"; d.tags = Array.isArray(d.tags) ? d.tags : []; d.manual = d.manual || {}; d.page = Math.min(Math.max(+d.page || 0, 0), PAGES.length - 1); }
ensure();
let page = d.page;

let timer;
function showVer(){ const e = document.getElementById("ver"); if(e) e.textContent = "v" + (d.version || 0); }
function persist(){ showVer();
  clearTimeout(timer); status.textContent = "저장 중…";
  timer = setTimeout(() => { try { localStorage.setItem(KEY, JSON.stringify(d)); status.textContent = "✔ 자동 저장됨 " + new Date().toLocaleTimeString("ko-KR"); } catch(e){ status.textContent = "⚠ 이 화면에서는 자동 저장이 안 돼요 — 💾 파일로 저장을 눌러 주세요"; } }, 300);
}

// ───── 저장 폴더 ─────
let dirHandle = null, dirAsked = false;
const idb = () => new Promise((res, rej) => { const r = indexedDB.open("workbook-apps", 1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
async function idbGet(k){ const db = await idb(); return new Promise((res, rej) => { const q = db.transaction("kv").objectStore("kv").get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
async function idbSet(k, v){ const db = await idb(); return new Promise((res, rej) => { const q = db.transaction("kv", "readwrite").objectStore("kv").put(v, k); q.onsuccess = () => res(); q.onerror = () => rej(q.error); }); }

    case "market": { const m = market(); return qHtml(["c_who", "① 누가 살까요? (구매할 고객을 구체적으로)", "예) 학교 근처에 사는 20대 대학생, 점심값을 직접 쓰는 사람", null])
      + `<div class="q"><label>② 시장 규모 간단 계산기 <small>(대략적인 추정이면 충분해요)</small></label><div class="row4">

  }

function calcHtml(m){
  if(m.target === null && m.buyers === null && m.size === null) return "<small>숫자를 넣으면 자동으로 계산돼요.</small>";
  return `대상 고객 <b>${m.target === null ? "-" : nf(m.target) + "명"}</b> → 구매 예상 <b>${m.buyers === null ? "-" : nf(m.buyers) + "명"}</b> → 연간 시장 규모 <span class="big">${m.size === null ? "-" : "약 " + won(m.size)}</span>`;
}
function cardHtml(k){
  const it = ITEMS[k];
  return `<div class="card" data-out="${it.out}"><h2><span class="n">${it.no}</span>${esc(it.title)}</h2><p class="tip">${esc(it.tip)}</p>${it.qs ? it.qs.map(qHtml).join("") : customHtml(it)}${outHtml(it)}</div>`;
}
function infoHtml(){
  const solo = d.mode === "solo";
  return `<div class="card"><h2><span class="n">★</span>참여 형태 · 이름 · 아이템 이름</h2><p class="tip">개인으로 참여하는지, 팀으로 참여하는지 먼저 골라 주세요. 양식 맨 위에 들어가는 정보예요.</p>
   <div class="tags" style="margin-bottom:10px"><label class="${solo ? "" : "on"}"><input type="radio" name="mode" data-mode="team" ${solo ? "" : "checked"}>👥 팀으로 참여</label><label class="${solo ? "on" : ""}"><input type="radio" name="mode" data-mode="solo" ${solo ? "checked" : ""}>🙋 개인으로 참여</label></div>
   ${solo ? qHtml(["solo", "참여자 이름", "예) 홍길동", null]) : `<div class="row2">${qHtml(["team", "팀 이름", "예) 하루", null])}${qHtml(["members", "팀원 이름 (쉼표로 구분)", "예) 홍길동, 김철수, 이영희", null])}</div>`}
   ${qHtml(["item", "아이템(아이디어) 이름", "예) 새벽 조리 구독 도시락 ‘하루담’", null])}</div>`;
}
function docHtml(){
  const rows = ITEMS.map(it => { const t = (d[it.out] || "").trim(); return `<tr><th>${it.no}. ${esc(it.title)}</th></tr><tr><td class="a ${t ? "" : "empty"}" style="height:${it.no === 2 || it.no === 6 ? 70 : 90}px">${t ? esc(t) : "(작성 전)"}</td></tr>`; }).join("");
  return `<div class="doc" id="doc"><h3>${rptName()}</h3><table>${d.mode === "solo" ? `<tr><td colspan="2"><b>참여자명 ( ${esc(d.solo) || "&nbsp;&nbsp;&nbsp;"} )</b> <span style="color:#666">· 개인</span></td></tr>` : `<tr><td style="width:45%"><b>( ${esc(d.team) || "&nbsp;&nbsp;&nbsp;"} )팀</b></td><td><b>참여자명 ( ${esc(d.members) || "&nbsp;&nbsp;&nbsp;"} )</b></td></tr>`}<tr><td colspan="2"><b>아이템(아이디어)</b>&nbsp;&nbsp;${esc(d.item) || "&nbsp;"}</td></tr></table><table style="margin-top:-1px">${rows}</table></div>`;
}
function render(){
  d.page = page;
  const p = PAGES[page];
  $("steps").innerHTML = PAGES.map((x, i) => `<button class="${i === page ? "on" : ""}" data-go="${i}"><b>${x.name}</b><small>${x.sub}</small></button>`).join("");
  let html = "";
  if(page === 0) html += `<div class="intro">처음 쓰는 분도 괜찮아요! 질문에 짧게 답하면 문장이 <b>자동으로 만들어져요</b>. 어떤 느낌인지 궁금하면 <button data-fix="example">💡 예시로 채워서 구경하기</button></div>` + infoHtml();
  html += p.items.map(cardHtml).join("");
  if(p.last){
    const miss = ITEMS.filter(it => !done(it.out));
    html += `<div class="card nodoc"><h2><span class="n">✓</span>완성 점검 · 문서로 저장</h2><p class="tip">아래는 저장될 문서(${rptName()} 양식)의 미리보기예요. 비어 있는 항목은 문서에도 비어서 나옵니다.</p>
      <div class="chk">${ITEMS.map(it => `<div class="${done(it.out) ? "ok" : "no"}">${done(it.out) ? "✔" : "✖"} ${it.no}. ${esc(it.title.length > 22 ? it.title.slice(0, 22) + "…" : it.title)}</div>`).join("")}</div>
      <div class="final"><button class="go" data-fix="docx">📄 문서로 저장 (Word)</button><button data-fix="print">🖨 인쇄 / PDF로 저장</button></div></div>` + docHtml();
  }
  $("page").innerHTML = html;
  $("prev").disabled = page === 0; $("next").style.visibility = page === PAGES.length - 1 ? "hidden" : "visible";
  $("mid").textContent = `${page + 1} / ${PAGES.length} 화면`;
  Object.keys(COMPOSE).forEach(updateHints);
  window.scrollTo({top: 0});
  persist();
}
function refreshDoc(){ const el = $("doc"); if(el) el.outerHTML = docHtml(); }

// ───── 이벤트 ─────
function onField(k, v){
  d[k] = v;
  if(Object.keys(COMPOSE).includes(k)){ d.manual[k] = true; updateHints(k); }
  allRecompose();   // 다른 항목의 내용이 바뀌면 맥락이 달라지므로 자동 작성 문장도 함께 갱신
  refreshHelps();
  if(["c_pop", "c_pct", "c_buy", "c_price"].includes(k)){ const b = $("calcbox"); if(b) b.innerHTML = calcHtml(market()); }
  refreshDoc(); persist();
}
document.addEventListener("input", e => { const t = e.target; if(t.dataset.k) onField(t.dataset.k, t.value); });
document.addEventListener("change", e => {
  const t = e.target;
  if(t.dataset.mode){ d.mode = t.dataset.mode; render(); persist(); return; }
  if(t.dataset.tag){ const tag = t.dataset.tag; d.tags = t.checked ? [...new Set([...d.tags, tag])] : d.tags.filter(x => x !== tag); t.closest("label").classList.toggle("on", t.checked); recompose("p_text"); refreshDoc(); persist(); }
});
document.addEventListener("click", e => {
  const go = e.target.closest("[data-go]"); if(go){ page = +go.dataset.go; render(); return; }
  const ap = e.target.closest("[data-apply]"); if(ap){ applyDraft(ap.dataset.apply); ap.textContent = "✔ 적용됨"; return; }
  const ao = e.target.closest("[data-applyosp]"); if(ao){ d.ospVar = +ao.dataset.applyosp; applyDraft("o_text"); ao.textContent = "✔ 적용됨"; return; }
  const hp = e.target.closest("[data-help]"); if(hp){ toggleHelp(hp.dataset.help); return; }
  const chip = e.target.closest("[data-chip]");
  if(chip){ const k = chip.dataset.chip, text = (CHIPSTORE[k] || [])[+chip.dataset.i]; if(text === undefined) return; const el = document.querySelector(`input[data-k="${k}"]`); if(el){ el.value = text; onField(k, text); el.focus(); } return; }
  const redo = e.target.closest("[data-redo]"); if(redo){ const o = redo.dataset.redo; d.manual[o] = false; recompose(o); const el = document.querySelector(`[data-k="${o}"]`); if(el) el.value = d[o]; refreshDoc(); persist(); return; }
  const fx = e.target.closest("[data-fix]"); if(!fx) return; const k = fx.dataset.fix;
  if(k === "loadProblems"){ const list = d.tags.map(tagPhrase); [1, 2, 3].forEach((i, idx) => { if(!d["sp" + i].trim() && list[idx]) d["sp" + i] = list[idx]; }); if(!list.length) alert("3번에서 ‘아쉬운 점’을 먼저 골라 주세요."); recompose("s_text"); render(); }
  else if(k === "example"){ if(FIELDS.some(f => String(d[f] || "").trim()) && !confirm("입력한 내용이 예시로 바뀝니다. 계속할까요?")) return; Object.assign(d, EXAMPLE, {manual: {}}); d.tags = [...EXAMPLE_TAGS]; allRecompose(); render(); }
  else if(k === "ospnext"){ d.ospVar = (d.ospVar || 0) + 1; d.manual.o_text = false; recompose("o_text"); const el = document.querySelector('[data-k="o_text"]'); if(el) el.value = d.o_text; refreshDoc(); persist(); }
  else if(k === "docx") makeDocx();
  else if(k === "print") window.print();
});
$("prev").onclick = () => { if(page > 0){ page--; render(); } };
$("next").onclick = () => { if(page < PAGES.length - 1){ page++; render(); } };
$("btnSave").onclick = async () => { d.version = (d.version || 0) + 1; await saveFile(new Blob([JSON.stringify(d)], {type: "application/json"}), fname("json")); persist(); };
$("fileLoad").onchange = e => { const f = e.target.files[0]; if(!f) return; const rd = new FileReader(); rd.onload = () => { try { const x = JSON.parse(rd.result); if(x.m_text === undefined) throw 0; d = x; ensure(); page = d.page; render(); alert("불러오기 완료!"); } catch(err){ alert("올바른 파일이 아닙니다."); } }; rd.readAsText(f); e.target.value = ""; };
$("btnReset").onclick = () => { if(!confirm('입력한 내용이 모두 지워집니다. 먼저 "파일로 저장"을 해두셨나요?\n정말 새로 시작할까요?')) return; d = {}; localStorage.removeItem(KEY); ensure(); page = 0; render(); status.textContent = "초기화됨"; };

async function makeDocx(){
  const run = (t, o = {}) => `<w:r><w:rPr><w:rFonts w:ascii="맑은 고딕" w:eastAsia="맑은 고딕" w:hAnsi="맑은 고딕"/>${o.b ? "<w:b/>" : ""}<w:sz w:val="${o.sz || 20}"/></w:rPr>${String(t ?? "").split("\n").map((l, i) => `${i ? "<w:br/>" : ""}<w:t xml:space="preserve">${esc(l)}</w:t>`).join("")}</w:r>`;
  const para = (t, o = {}) => `<w:p><w:pPr>${o.center ? '<w:jc w:val="center"/>' : ""}<w:spacing w:before="${o.before ?? 40}" w:after="${o.after ?? 40}"/></w:pPr>${run(t, o)}</w:p>`;
  const border = ["top", "left", "bottom", "right", "insideH", "insideV"].map(s => `<w:${s} w:val="single" w:sz="8" w:space="0" w:color="333333"/>`).join("");
  const W = 10300;
  const cell = (inner, w, o = {}) => `<w:tc><w:tcPr><w:tcW w:w="${w}" w:type="dxa"/>${o.span ? `<w:gridSpan w:val="${o.span}"/>` : ""}${o.fill ? `<w:shd w:val="clear" w:color="auto" w:fill="${o.fill}"/>` : ""}</w:tcPr>${inner}</w:tc>`;
  const row = (cells, h) => `<w:tr>${h ? `<w:trPr><w:trHeight w:val="${h}" w:hRule="atLeast"/></w:trPr>` : ""}${cells}</w:tr>`;
  let rows = (d.mode === "solo" ? row(cell(para("참여자명 ( " + (d.solo || "          ") + " )   · 개인", {b: 1, sz: 22}), W, {span: 2})) : row(cell(para("( " + (d.team || "          ") + " )팀", {b: 1, sz: 22}), 4600) + cell(para("참여자명 ( " + (d.members || "          ") + " )", {b: 1, sz: 22}), W - 4600)))
    + row(cell(para("아이템(아이디어)   " + (d.item || ""), {b: 1, sz: 22}), W, {span: 2}));
  ITEMS.forEach(it => { const t = (d[it.out] || "").trim(); rows += row(cell(para(`${it.no}. ${it.title}`, {b: 1, sz: 21}), W, {span: 2, fill: "E9ECEF"})) + row(cell(para(t || " ", {sz: 20}), W, {span: 2}), it.no === 2 || it.no === 6 ? 1400 : 1900); });
  const body = para(rptName(), {b: 1, sz: 36, center: 1, before: 0, after: 120}) + `<w:tbl><w:tblPr><w:tblW w:w="${W}" w:type="dxa"/><w:tblBorders>${border}</w:tblBorders><w:tblLayout w:type="fixed"/></w:tblPr><w:tblGrid><w:gridCol w:w="4600"/><w:gridCol w:w="${W - 4600}"/></w:tblGrid>${rows}</w:tbl>`;
  const zip = new JSZip();
  zip.file("[Content_Types].xml", '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>');
  zip.file("_rels/.rels", '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');
  zip.file("word/_rels/document.xml.rels", '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"></Relationships>');
  zip.file("word/document.xml", '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>' + body + '<w:p/><w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="850" w:right="800" w:bottom="850" w:left="800" w:header="567" w:footer="567" w:gutter="0"/></w:sectPr></w:body></w:document>');

function planHtml(model){

      case "h1": return `<h2 class="ph1">${esc(n.text)}</h2>`;
      case "h2": return `<h3 class="ph2">${esc(n.text)}</h3>`;

  const body = model.nodes.map(n => {
    switch(n.t){
      case "title": return para(n.text, {b: 1, sz: 38, center: 1, before: 0, after: 80});

  zip.file("word/_rels/document.xml.rels", '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"></Relationships>');
  zip.file("word/document.xml", '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>' + body + '<w:p/><w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="850" w:right="800" w:bottom="850" w:left="800" w:header="567" w:footer="567" w:gutter="0"/></w:sectPr></w:body></w:document>');
  await saveFile(await zip.generateAsync({type: "blob", mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document"}), `사업계획서초안_${(model.item || "무제").replace(/[\\/:*?"<>|]/g, "")}.docx`);
}

    else { type = "hub"; pp = [us, cu, ...pts]; rel = [{f: 0, t: 1, l: offer, k: "prod"}, {f: 1, t: 0, l: rev, k: "money"}]; pts.forEach((p, i) => { rel.push({f: i + 2, t: 0, l: short(N.partners[i].give, 18) || "공급", k: "prod"}, {f: 0, t: i + 2, l: short(N.partners[i].pay, 14) || "대가 지급", k: "money"}); }); }
    dbg("diagram built", type, pp.length, rel.length); d.type = type; d.pp = pp; d.rel = rel.slice(0, 12); d.pos = {}; common(x); dbg("diagram redo"); redo("t_text", "p_text", "r_text", "e_text"); dbg("diagram redone");
    return `참여자 ${pp.length}곳·관계 ${d.rel.length}개로 도식 초안을 만들었어요 (그림을 보고 고쳐 주세요)`;
  }
};
window.SSIMP = SSIMP;

// ───── 가져오기 실행 ─────
const DBG = /ss-dbg/.test(location.hash); const dbg = (...a) => { if(DBG) console.log("SSDBG", ...a); };
function runImp(src, done, auto){ dbg("runImp", src);
  const spec = (IMP[ME] || {})[src]; const st = stateOf(src);
  if(!spec || !st) return done && done("앞 단계 내용이 아직 없어요");
  if(spec.over && curFill() > 4 && auto) return done && done("이미 작성한 내용이 있어 건너뛰었어요 (직접 가져오기를 눌러 주세요)");
  if(spec.over && curFill() > 4 && !confirm("이미 작성한 내용 중 같은 칸은 바뀔 수 있어요.\n계속할까요?")) return done && done("취소했어요");
  const oa = window.alert, msgs = []; window.alert = m => { msgs.push(String(m)); };
  const fin = res => { dbg("fin", src, String(res || msgs[0]).slice(0, 60)); window.alert = oa; const bad = /아닙니다|올바른|못했|아직 없어요/.test(String(res || msgs[0] || "")); if(!bad) markSeen(src, st); const first = String(res || msgs[0] || "가져왔어요").split("\n").filter(Boolean).slice(0, 2).join(" · "); done && done(first.slice(0, 160)); try { panelRefresh(); } catch(e){} };
  try {
    if(spec.via === "obj"){ const r = SSIMP[spec.fn](st, src); fin(r); }
    else { const fn = window[spec.fn]; if(typeof fn !== "function"){ window.alert = oa; return done && done("이 화면에서는 가져오기를 쓸 수 없어요"); } fn(new File([JSON.stringify(st)], src + ".json", {type: "application/json"})); let tries = 0; const wait = () => { if(msgs.length || ++tries > 40) return fin(); setTimeout(wait, 120); }; setTimeout(wait, 150); }
  } catch(e){ window.alert = oa; done && done("가져오지 못했어요 (" + (e && e.message || e) + ")"); }
}
function coreFill(){
  if(typeof d === "undefined" || !d) return false; let ch = false;
  ["item", "team", "members", "solo"].forEach(k => {
    if(k in d && !T(d[k])){ const core = parse(LS.get("ss-core-v1")) || {}; if(T(core[k])){ d[k] = T(core[k]); ch = true; return; } for(const id of Object.keys(REG)){ if(id === ME) continue; const s = stateOf(id); if(s && T(s[k])){ d[k] = T(s[k]); ch = true; break; } } }
  });
  if(ch){ try { render(); persist(); } catch(e){} } return ch;
}
function autoRun(){
  const q = (location.hash.match(/ss-pull=(\w+)/) || [])[1];
  if(q && (IMP[ME] || {})[q]){ history.replaceState(null, "", location.pathname + location.search); runImp(q, m => toast("🔗 " + REG[q].t + " → " + m)); return; }
  if(LS.get("ss-auto-v1") === "off" || curFill() > 4) return;
  const todo = Object.keys(IMP[ME] || {}).filter(s => status(s) === "new"); if(!todo.length) return;
  let i = 0, got = 0; const next = () => { if(i >= todo.length){ if(got) toast("🔗 앞 단계 " + got + "곳에서 내용을 가져왔어요 (빈 칸만 채움)"); return; } const s = todo[i++]; runImp(s, m => { if(!/없어요|취소|못했|건너뛰/.test(m)) got++; setTimeout(next, 150); }, true); }; next();
}

// ───── 화면 ─────
const css = `#ss-pill{position:fixed;left:12px;bottom:82px;z-index:99990;font:700 13px 'Malgun Gothic',sans-serif;background:#16294a;color:#fff;border:0;border-radius:999px;padding:9px 14px;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.28)}#ss-pill i{font-style:normal;background:#ef4444;border-radius:999px;padding:0 7px;margin-left:6px;font-size:12px}#ss-panel{position:fixed;left:12px;bottom:126px;z-index:99991;width:min(380px,calc(100vw - 24px));max-height:70vh;overflow:auto;background:#fff;color:#1f2937;border:1.5px solid #16294a;border-radius:14px;padding:12px 14px;box-shadow:0 8px 28px rgba(0,0,0,.3);font:13px/1.5 'Malgun Gothic',sans-serif;display:none}#ss-panel h4{margin:10px 0 4px;font-size:13px;color:#16294a}#ss-panel .hd{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:14px}#ss-panel a{color:#2563eb;text-decoration:none}#ss-panel a:hover{text-decoration:underline}#ss-panel .row{display:flex;align-items:center;gap:6px;padding:5px 0;border-bottom:1px solid #eef2f7}#ss-panel .row b{flex:1}#ss-panel .st{font-size:11.5px;border-radius:999px;padding:1px 8px}#ss-panel .st.none{background:#f1f5f9;color:#64748b}#ss-panel .st.new{background:#fee2e2;color:#b91c1c}#ss-panel .st.synced{background:#dcfce7;color:#166534}#ss-panel button{font:inherit;font-size:12px;border:1px solid #16294a;background:#fff;color:#16294a;border-radius:8px;padding:2px 9px;cursor:pointer}#ss-panel button.go{background:#16294a;color:#fff}#ss-panel .msg{font-size:12px;color:#166534;background:#f0fdf4;border-radius:8px;padding:3px 8px;margin:2px 0}#ss-panel .ref{font-size:12px;color:#334155;padding:2px 0}#ss-panel .sm{font-size:11.5px;color:#64748b}#ss-toast{position:fixed;left:12px;bottom:130px;z-index:99992;max-width:min(420px,calc(100vw - 24px));background:#166534;color:#fff;border-radius:10px;padding:8px 12px;font:600 13px 'Malgun Gothic',sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.25);display:none}@media print{#ss-pill,#ss-panel,#ss-toast{display:none!important}}`;
const st = document.createElement("style"); st.textContent = css; document.head.appendChild(st);
const pill = document.createElement("button"); pill.id = "ss-pill"; pill.type = "button"; document.body.appendChild(pill);
const panel = document.createElement("div"); panel.id = "ss-panel"; document.body.appendChild(panel);
const tbox = document.createElement("div"); tbox.id = "ss-toast"; document.body.appendChild(tbox);
let tt; function toast(m){ tbox.textContent = m; tbox.style.display = "block"; clearTimeout(tt); tt = setTimeout(() => { tbox.style.display = "none"; }, 5000); }
const results = {};
function nextOf(){ return Object.keys(IMP).filter(k => IMP[k][ME]); }
function panelRefresh(){
  const ups = Object.keys(IMP[ME] || {}), nw = ups.filter(s => status(s) === "new").length;
  pill.innerHTML = "🔗 창업시뮬" + (nw ? `<i>${nw}</i>` : ""); pill.title = "앞뒤 단계 연결";
  const lab = {none: "아직 없음", new: "🆕 새 내용", synced: "✔ 가져옴"};
  let h = `<div class="hd"><span>${me.e} ${me.t}</span><a href="../창업시뮬/index.html">🧭 허브 열기</a></div><div class="sm">같은 브라우저에서 앞 단계 앱에 쓴 내용이 자동으로 공유돼요. 이미 쓴 칸은 지우지 않고, 빈 칸만 채워요.</div>`;
  if(ups.length){ h += `<h4>⬅ 앞 단계에서 가져오기</h4>` + ups.map(s => { const sv = status(s); return `<div class="row"><b>${REG[s].e} ${REG[s].t}</b><span class="st ${sv}">${lab[sv]}</span>${sv !== "none" ? `<button class="go" data-ss-pull="${s}">가져오기</button>` : `<a href="../${REG[s].dir}/index.html">열기</a>`}</div>${results[s] ? `<div class="msg">${esc(results[s])}</div>` : ""}`; }).join(""); }
  else h += `<h4>⬅ 앞 단계</h4><div class="sm">이 앱이 연결 흐름의 시작이에요.</div>`;
  const nx = nextOf(); if(nx.length) h += `<h4>➡ 이 내용이 이어지는 곳</h4>` + nx.map(k => `<div class="row"><b>${REG[k].e} ${REG[k].t}</b><a href="../${REG[k].dir}/index.html#ss-pull=${ME}">이어서 쓰기 →</a></div>`).join("");
  const refs = (REF[ME] || []).map(k => ({k, p: pubOf(k)})).filter(o => (o.p.cards || []).length);
  if(refs.length) h += `<h4>📎 참고 — 다른 모듈에서 고른 카드</h4>` + refs.map(o => `<div class="ref"><b>${REG[o.k].e} ${REG[o.k].t}</b> : ${o.p.cards.map(c => esc(c.n)).join(", ")}</div>`).join("");
  h += `<h4>⚙ 설정</h4><label class="sm"><input type="checkbox" id="ss-auto" ${LS.get("ss-auto-v1") === "off" ? "" : "checked"}> 처음 열 때 앞 단계 내용을 자동으로 가져오기 (비어 있는 앱만)</label><div class="sm" style="margin-top:4px"><a href="./${me.dir}_사전교육.pptx">📑 이 모듈 사전교육 PPT</a></div>`;
  panel.innerHTML = h;
}
pill.onclick = () => { panelRefresh(); panel.style.display = panel.style.display === "block" ? "none" : "block"; };
panel.addEventListener("click", e => { const b = e.target.closest("[data-ss-pull]"); if(!b) return; const s = b.dataset.ssPull; b.disabled = true; b.textContent = "가져오는 중…"; runImp(s, m => { results[s] = m; panelRefresh(); }); });
panel.addEventListener("change", e => { if(e.target.id === "ss-auto") LS.set("ss-auto-v1", e.target.checked ? "on" : "off"); });
document.addEventListener("visibilitychange", () => { if(!document.hidden) panelRefresh(); });
window.addEventListener("storage", () => panelRefresh());

// ───── 다른 앱이 참고하도록 선택 카드 공유 ─────
const galleryCards = () => (d.rows || []).filter(r => r.id !== null && r.id !== undefined && CARDS[r.id]).map(r => { const c = CARDS[r.id]; const note = Object.keys(r).filter(k => k !== "id" && typeof r[k] === "string" && r[k].trim()).map(k => r[k].trim())[0] || ""; return {n: c.n, cat: c.cat, note}; });
const PUB = {
  bench: () => ({cards: galleryCards()}), diff: () => ({cards: galleryCards()}),
  market: () => ({cards: galleryCards(), comp: (d.cp || []).slice(1).map(p => p && p.name).filter(Boolean), tam: d.tam, samp: d.samp, somp: d.somp, def: d.def}),
  revenue: () => ({cards: (d.rows || []).filter(r => r.id).map(r => ({n: CM[r.id].name, cat: CM[r.id].cat, note: ""}))})
};
function pubNow(){ const f = PUB[ME]; if(!f) return; try { LS.set("ss-pub-" + ME, JSON.stringify(f())); } catch(e){} }
const _si = Storage.prototype.setItem; Storage.prototype.setItem = function(k, v){ _si.apply(this, arguments); if(k === me.key) pubNow(); };

setTimeout(() => { try { pubNow(); coreFill(); panelRefresh(); autoRun(); } catch(e){ console.warn("ss", e); } }, 400);
if(/ss-example/.test(location.hash)) setTimeout(() => { const b = document.querySelector('[data-fix="example"]'); if(b) b.click(); }, 900);
if(/ss-test/.test(location.search + location.hash)) setTimeout(() => { const r = document.createElement("pre"); r.id = "RESULT"; r.textContent = JSON.stringify({d: typeof d !== "undefined" ? d : null, panel: panel.innerText, toast: tbox.textContent}); document.body.appendChild(r); }, 4500);
})();

</script>
